<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manifest v2 原生操作演示</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 24px; color: #1d1d1f; }
        h1 { font-size: 26px; }
        p { color: #68686d; line-height: 1.5; }
        button { width: 100%; min-height: 52px; margin-top: 20px; border: 0; border-radius: 14px; background: #4f6af6; color: white; font-size: 17px; font-weight: 600; }
        button.secondary { background: #253045; }
        .route-lab { margin-top: 24px; padding: 18px; border: 1px solid #d9d9e3; border-radius: 16px; background: #fafafc; }
        .route-lab h2 { margin: 0 0 8px; font-size: 20px; }
        .route-lab p { margin: 0 0 12px; font-size: 14px; line-height: 1.4; }
        .route-state { margin: 12px 0 0; padding: 12px; background: #eef1f8; border-radius: 10px; color: #1e2a4a; font-weight: 600; }
        a.route-link { display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 14px; border-radius: 12px; background: #4f6af6; color: white; font-size: 16px; font-weight: 600; text-decoration: none; }
        .route-lab button { min-height: 48px; margin-top: 14px; border-radius: 12px; font-size: 16px; }
        button .plus { display: inline-block; vertical-align: -3px; margin-right: 6px; }
    </style>
</head>
<body>
    <h1>Manifest v2 原生操作演示</h1>
    <p>分享由用户主动触发，随后由 iOS 系统分享面板展示内容并让用户选择去向。剪贴板和定位需要一次用户授权；添加到主屏幕会弹出引导，添加到 Drel 首页只会添加当前已注册应用。</p>
    <button id="phone-home-v2" onclick="addPhoneHomeScreenDemo()"><span class="plus"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>添加到主屏幕</button>
    <button id="clipboard-v2" onclick="clipboardV2Demo()">读取剪贴板</button>
    <button id="location-v2" onclick="locationV2Demo()">获取当前位置</button>
    <button id="home-v2" onclick="addToHomeScreenDemo()">添加到 Drel 首页</button>
    <button id="share-v2" onclick="shareV2Demo()">分享演示内容</button>
    <section id="route-lab" class="route-lab">
        <h2>路由返回测试</h2>
        <p>先点底部的「切换沉浸全屏」，然后在这里选不同方式跳转，最后从屏幕最左侧向右滑测试网页返回。没有可返回历史时保持不动，退出网页只能点悬浮条里的 ×。</p>
        <p id="route-state" class="route-state">当前路由：首页</p>
        <a id="route-anchor" class="route-link" href="?route=a-tag">1. A 标签跳转（整页导航）</a>
        <button id="route-href" onclick="navigateWithHref()">2. location.href 跳转（整页导航）</button>
        <button id="route-assign" onclick="navigateWithAssign()">3. location.assign 跳转（整页导航）</button>
        <button id="route-open" onclick="navigateWithOpen()">4. window.open(_self) 当前页跳转</button>
        <button id="route-push" onclick="pushRoute()">5. history.pushState（同文档路由）</button>
        <button id="route-hash" onclick="setHashRoute()">6. hash 路由（#route=hash）</button>
        <button id="route-replace" class="secondary" onclick="replaceRoute()">7. history.replaceState（替换，不可返回）</button>
    </section>
    <button id="fullscreen-v2" onclick="fullscreenV2Demo()" class="secondary">切换沉浸全屏</button>
    <p id="result"></p>
    <script>
        let fullscreenEnabled = false;
        const output = document.getElementById('result');
        const show = (message) => { output.textContent = message; };
        async function clipboardV2Demo() {
            try {
                const result = await window.BarkBridge.callNative('clipboard', { action: 'read' });
                show(`剪贴板：${result && result.data ? result.data.text || result.data : result}`);
            } catch (error) { show(`剪贴板失败：${error.message}`); }
        }
        async function locationV2Demo() {
            try {
                const result = await window.BarkBridge.callNative('getLocation', {});
                show(`位置：${result && result.data ? JSON.stringify(result.data) : JSON.stringify(result)}`);
            } catch (error) { show(`定位失败：${error.message}`); }
        }
        async function addToHomeScreenDemo() {
            try {
                const result = await window.BarkBridge.callNative('addToHomeScreen', { reason: '添加当前演示应用' });
                show(`添加到主页：${result && result.data ? result.data.result : 'done'}`);
            } catch (error) { show(`添加失败：${error.message}`); }
        }
        async function addPhoneHomeScreenDemo() {
            try {
                const result = await window.BarkBridge.callNative('addToHomeScreen', {
                    reason: '把当前演示应用添加到 iPhone 主屏幕',
                    placement: 'phoneHomeScreen'
                });
                show(`主屏幕引导：${result && result.data ? result.data.result : 'done'}`);
            } catch (error) { show(`主屏幕引导失败：${error.message}`); }
        }
        async function shareV2Demo() {
            try {
                await window.BarkBridge.callNative('share', {
                    text: '来自「原生能力演示」的分享内容',
                    url: window.location.href,
                    reason: '页面传入的动态文案不得覆盖签名用途'
                });
            } catch (error) { show(`分享失败：${error.message}`); }
        }
        async function fullscreenV2Demo() {
            fullscreenEnabled = !fullscreenEnabled;
            await window.BarkBridge.callNative('fullscreen', { enabled: fullscreenEnabled });
        }

        const routeState = document.getElementById('route-state');
        const updateRouteLabel = () => {
            const queryRoute = new URLSearchParams(location.search).get('route');
            const hashRoute = location.hash ? location.hash.replace(/^#/, '') : '';
            const route = queryRoute || hashRoute || '首页';
            routeState.textContent = `当前路由：${route} · history.length=${history.length}`;
        };

        const buildRouteURL = (name) => {
            const target = new URL(location.href);
            target.searchParams.set('route', name);
            target.hash = '';
            return target.href;
        };

        function navigateWithHref() { location.href = buildRouteURL('location-href'); }
        function navigateWithAssign() { location.assign(buildRouteURL('location-assign')); }
        function navigateWithOpen() { window.open(buildRouteURL('window-open'), '_self'); }
        function pushRoute() {
            history.pushState({ route: 'history-push' }, '', buildRouteURL('history-push'));
            updateRouteLabel();
        }
        function replaceRoute() {
            history.replaceState({ route: 'history-replace' }, '', buildRouteURL('history-replace'));
            updateRouteLabel();
        }
        function setHashRoute() {
            location.hash = 'route=hash';
        }

        document.getElementById('route-anchor').href = buildRouteURL('a-tag');
        window.addEventListener('popstate', updateRouteLabel);
        window.addEventListener('hashchange', updateRouteLabel);
        window.addEventListener('pageshow', updateRouteLabel);
        updateRouteLabel();
    </script>
</body>
</html>
