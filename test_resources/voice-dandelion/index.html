<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>吹散蒲公英</title><style>*{box-sizing:border-box}body{margin:0;background:#10203a;color:#f4f8ff;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}main{width:min(100%,620px);padding:20px}p{color:#bfd0e5;line-height:1.6}canvas{display:block;width:100%;border-radius:20px;background:linear-gradient(#a4dfff,#fff4dd);touch-action:manipulation}button{background:#536df6;color:white;border:0;border-radius:14px;padding:14px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.meter{height:10px;background:#34455f;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#83ebc4}</style></head><body><main><h1>吹散蒲公英</h1><p>先点击开启麦克风，轻轻吹气让种子飞走。只读取实时音量，不保存录音。</p><canvas id="scene" width="620" height="420" aria-label="蒲公英画面"></canvas><div class="controls"><button id="start">开启麦克风</button><button id="practice">键盘试玩</button><button id="stop" disabled>停止</button><button id="reset">重新长出</button></div><div class="meter"><i id="level"></i></div><p id="status">在 HTTPS 或 localhost 打开；键盘试玩时按住空格模拟吹气。</p></main><script src="../voice-games/audio-level.js"></script><script>
const c=document.querySelector('#scene'),x=c.getContext('2d'),status=document.querySelector('#status'),start=document.querySelector('#start'),stop=document.querySelector('#stop'),level=document.querySelector('#level');let run=false,manual=false,cal=0,noise=.01,wind=0,last=0,seeds=[],generation=0;
function grow(){seeds=Array.from({length:72},(_,i)=>{let a=i*2.39996,r=8+Math.sqrt(i/72)*57;return{x:190+Math.cos(a)*r,y:190+Math.sin(a)*r,vx:0,vy:0,free:false,phase:i}})}
const sound=new SoundLevel(()=>end('麦克风已停止，请重新点击开始。'));
function close(){sound.stop()}
function end(text){generation++;run=false;close();start.disabled=false;stop.disabled=true;level.style.width='0%';status.textContent=text}
async function begin(){if(run||start.disabled)return;const attempt=++generation;start.disabled=true;status.textContent='等待麦克风授权…';try{const source=await sound.start();if(attempt!==generation)return;if(document.hidden){close();return}noise=.01;cal=1;status.textContent=`${source==='bridge'?'Drel Bridge':'网页麦克风'}已开启，正在校准背景音…`}catch(e){if(attempt!==generation)return;close();start.disabled=false;status.textContent='麦克风不可用或未授权：'+(e.message||'请重试');return}run=true;stop.disabled=false;last=0;requestAnimationFrame(t=>frame(t,attempt))}
function frame(t,session){if(!run||session!==generation)return;let dt=Math.min(.04,(t-last)/1000||0);last=t;let rms=sound.read();if(cal>0){cal-=dt;noise=Math.max(noise,rms);if(cal<=0)status.textContent='校准完成，轻轻吹气吧。'}let input=manual?.7:Math.max(0,Math.min(1,(rms-noise*1.8)*20));if(cal>0)input=0;wind+=(input-wind)*Math.min(1,dt*8);level.style.width=100*wind+'%';draw(dt);requestAnimationFrame(t=>frame(t,session))}
function draw(dt=0){x.clearRect(0,0,620,420);x.fillStyle='#82c99d';x.fillRect(0,370,620,50);x.strokeStyle='#518762';x.lineWidth=6;x.beginPath();x.moveTo(190,370);x.quadraticCurveTo(180,300,190,190);x.stroke();x.fillStyle='#e4b769';x.beginPath();x.arc(190,190,14,0,7);x.fill();for(let s of seeds){if(!s.free&&wind>.15&&Math.random()<wind*dt*4)s.free=true;if(s.free){s.vx+=(wind*100+18)*dt;s.vy-=12*dt;s.x+=s.vx*dt;s.y+=s.vy*dt+Math.sin(s.phase+s.x/35)*dt*10}x.strokeStyle='#fff';x.lineWidth=1.6;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+7,s.y-8);x.moveTo(s.x+7,s.y-8);x.lineTo(s.x+2,s.y-14);x.moveTo(s.x+7,s.y-8);x.lineTo(s.x+8,s.y-16);x.moveTo(s.x+7,s.y-8);x.lineTo(s.x+14,s.y-13);x.stroke()}}
start.onclick=begin;document.querySelector('#practice').onclick=()=>{if(run||start.disabled)return;const session=++generation;cal=0;run=true;start.disabled=true;stop.disabled=false;status.textContent='键盘试玩：按住空格模拟吹气。';last=0;requestAnimationFrame(t=>frame(t,session))};stop.onclick=()=>end('已停止，麦克风已关闭。');document.querySelector('#reset').onclick=()=>{grow();draw()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();manual=true}});addEventListener('keyup',e=>{if(e.code==='Space')manual=false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&(run||start.disabled))end('离开页面，麦克风已关闭。')});addEventListener('pagehide',()=>end('离开页面，麦克风已关闭。'));grow();draw();
</script></body></html>
