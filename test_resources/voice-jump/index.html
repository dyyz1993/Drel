<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>声音跳跳 · 原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#101832;color:#f5f7ff;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}main{width:min(100%,620px);padding:20px}h1{margin:0 0 8px}p{color:#afbeda;line-height:1.6}canvas{width:100%;background:linear-gradient(#9bd8ff,#e7f4fc);border-radius:20px;display:block;touch-action:manipulation}button{border:0;background:#536df6;color:white;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}.meter{height:10px;flex:1;min-width:130px;background:#33415e;border-radius:10px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#59e6a4}.hint{font-size:14px}.options{display:flex;gap:10px;align-items:center}input{accent-color:#728aff}</style></head><body><main><h1>声音跳跳</h1><p>大声或持续发声让小人跳过障碍，声音越强、持续越久，跳得越高。点击开始后安静一秒进行校准。</p><canvas id="game" width="620" height="320" aria-label="声音跳跃游戏"></canvas><div class="controls"><button id="start">开启麦克风并开始</button><button id="practice">键盘试玩</button><button id="stop" disabled>停止</button><div class="meter" aria-label="声音强度"><i id="level"></i></div></div><div class="options"><label for="sensitivity">灵敏度</label><input id="sensitivity" type="range" min="1" max="10" value="5"><span id="score">得分 0</span></div><p id="status" class="hint">需要 HTTPS 或 localhost；仅处理实时音量，不保存录音。模拟器麦克风行为不能代替真机验收。</p><p class="hint">键盘试玩：点击“键盘试玩”，按住空格模拟声音。</p></main><script src="../voice-games/audio-level.js"></script><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),meter=document.querySelector('#level'),start=document.querySelector('#start'),stop=document.querySelector('#stop'),scoreEl=document.querySelector('#score'),sens=document.querySelector('#sensitivity');let run=false,manual=false,last=0,score=0,obstacles=[],spawn=0,y=0,vy=0,energy=0,grounded=true,noise=.012,calibrate=0;
function reset(){score=0;obstacles=[];spawn=3.5;y=0;vy=0;energy=0;grounded=true;last=0;scoreEl.textContent='得分 0'}
let generation=0;
const sound=new SoundLevel(()=>end('麦克风已停止，请重新点击开始。'));
function closeMic(){sound.stop()}
async function begin(){if(run||start.disabled)return;const attempt=++generation;start.disabled=true;status.textContent='等待麦克风授权…';try{const source=await sound.start();if(attempt!==generation)return;if(document.hidden){sound.stop();return}noise=.012;calibrate=1;status.textContent=`${source==='bridge'?'Drel Bridge':'网页麦克风'}已开启，正在校准背景音…`}catch(e){if(attempt!==generation)return;closeMic();status.textContent='麦克风不可用或未授权：'+(e.message||'请重试');start.disabled=false;return}reset();run=true;start.textContent='正在游戏';stop.disabled=false;requestAnimationFrame(t=>frame(t,attempt))}
function end(message){generation++;run=false;closeMic();start.disabled=false;start.textContent='再来一次';stop.disabled=true;meter.style.width='0%';status.textContent=message}
function frame(t,session){if(!run||session!==generation)return;const dt=Math.min(.035,(t-last)/1000||0);last=t;let rms=sound.read();if(calibrate>0){calibrate-=dt;noise=Math.max(noise,rms);if(calibrate<=0)status.textContent='校准完成，发声跳跃；停止发声可提前降低跳高。'}let input=manual? .8:Math.max(0,Math.min(1,(rms-noise*1.8)*Number(sens.value)*3.5));if(calibrate>0)input=0;energy+=(input-energy)*Math.min(1,dt*12);meter.style.width=(energy*100)+'%';if(grounded&&energy>.035){vy=-410-energy*140;grounded=false}if(!grounded&&energy>.03&&vy<0)vy-=energy*900*dt;vy+=(vy>0 ? 1150*(1-0.65*energy) : 1150)*dt;y+=vy*dt;if(y>=0){y=0;vy=0;grounded=true}spawn-=dt;if(spawn<=0){obstacles.push({x:650,w:24+Math.random()*13,h:32+Math.random()*20});spawn=1.35+Math.random()*.9}ctx.clearRect(0,0,620,320);ctx.fillStyle='#8ccf9b';ctx.fillRect(0,270,620,50);ctx.fillStyle='#344fc1';ctx.fillRect(80,230+y,28,40);ctx.fillStyle='#ec785f';for(const o of obstacles){o.x-=190*dt;ctx.fillRect(o.x,270-o.h,o.w,o.h);if(o.x<108&&o.x+o.w>80&&230+y+40>270-o.h){end('撞到障碍了！调整灵敏度后再试一次。');return}}obstacles=obstacles.filter(o=>o.x+o.w>0);score+=dt*10;scoreEl.textContent='得分 '+Math.floor(score);requestAnimationFrame(t=>frame(t,session))}
start.onclick=begin;document.querySelector('#practice').onclick=()=>{if(run||start.disabled)return;const session=++generation;reset();calibrate=0;run=true;start.disabled=true;stop.disabled=false;status.textContent='键盘试玩：按住空格模拟发声。';requestAnimationFrame(t=>frame(t,session))};stop.onclick=()=>end('已停止，麦克风已关闭。');addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();manual=true}});addEventListener('keyup',e=>{if(e.code==='Space')manual=false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&(run||start.disabled))end('离开页面，麦克风已关闭。')});addEventListener('pagehide',()=>end('离开页面，麦克风已关闭。'));reset();ctx.fillStyle='#8ccf9b';ctx.fillRect(0,270,620,50);ctx.fillStyle='#344fc1';ctx.fillRect(80,230,28,40);
</script></body></html>
