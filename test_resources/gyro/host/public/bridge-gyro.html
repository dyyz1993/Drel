<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>陀螺仪躲避 · Bridge 版</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; background: #0b1020; font-family: -apple-system, "PingFang SC", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 25;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 8px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: linear-gradient(#0b1020ee, #0b102000);
    color: #dbe4ff; font-size: 13px;
  }
  .chip { border: 1px solid #3b4a7a; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .chip.ok { border-color: #34d399; color: #6ee7b7; }
  .chip.bad { border-color: #f87171; color: #fca5a5; }
  .chip.dim { color: #93a0c8; border-color: #2b3560; }
  #btnSensor, #btnCal, #btnDebug {
    border: 1px solid #4f6af6; color: #c7d2fe; background: #4f6af633;
    border-radius: 999px; padding: 5px 12px; font-size: 13px;
  }
  #score { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 44px); right: 14px; z-index: 9;
           color: #93a0c8; font-size: 12px; text-align: right; }
  #overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 10px; background: #0b1020d9; color: #e7ecff; }
  #overlay h1 { font-size: 24px; }
  #overlay p { color: #93a0c8; font-size: 13px; max-width: 30ch; text-align: center; line-height: 1.6; }
  #overlay button { margin-top: 6px; border: 0; border-radius: 12px; padding: 12px 28px;
                    font-size: 16px; background: #4f6af6; color: white; }
  #debugPanel {
    position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    z-index: 30; max-height: 52vh; overflow: auto; padding: 12px; border-radius: 16px;
    background: #111a2ef2; border: 1px solid #3b4a7a; color: #dbe4ff;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    box-shadow: 0 18px 48px #0008;
  }
  #debugPanel h2 { font: 700 15px/1.3 -apple-system, sans-serif; margin-bottom: 8px; }
  .debug-actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .debug-actions button {
    border: 1px solid #4f6af6; border-radius: 8px; padding: 6px 9px;
    background: #4f6af622; color: #dbe4ff; font: inherit;
  }
  .debug-actions button.sim {
    border-color: #34d399; color: #a7f3d0; background: #34d39918;
  }
  #debugFacts { white-space: pre-wrap; color: #aebbe4; }
  #debugLog { white-space: pre-wrap; margin-top: 8px; padding-top: 8px; border-top: 1px solid #334064; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">
  <span class="chip dim">Bridge 陀螺仪版</span>
  <span id="sensorChip" class="chip bad">传感器：未启用</span>
  <span id="hzChip" class="chip dim hidden">0 Hz</span>
  <button id="btnSensor">开启传感器</button>
  <button id="btnCal" class="hidden">校准</button>
  <button id="btnDebug">传感器调试</button>
</div>
<div id="score">得分 0 · 最佳 0</div>
<div id="overlay">
  <h1>陀螺仪躲避</h1>
  <p>左右倾斜手机控制飞船，躲开下落的障碍。<br>此版经 Drel Bridge 的 sensors 动作取传感器。<br>传感器属于可撤销授权；撤销后立即回触屏。</p>
  <button id="btnStart">开始游戏</button>
</div>
<section id="debugPanel" class="hidden">
  <h2>Bridge 传感器调试</h2>
  <div id="debugFacts">正在读取运行时信息…</div>
  <div class="debug-actions">
    <button id="debugRefresh">刷新环境</button>
    <button id="debugStatus">查询传感器</button>
    <button id="debugStart">启动加速度计</button>
    <button id="debugStop">停止</button>
    <button id="debugSimLeft" class="sim">模拟左倾</button>
    <button id="debugSimCenter" class="sim">模拟回中</button>
    <button id="debugSimRight" class="sim">模拟右倾</button>
    <button id="debugClear">清空日志</button>
    <button id="debugClose">收起调试</button>
  </div>
  <div id="debugLog"></div>
</section>
<script>
"use strict";
const Debug = (() => {
  const panel = document.getElementById("debugPanel");
  const facts = document.getElementById("debugFacts");
  const log = document.getElementById("debugLog");
  const lines = [];
  let eventCount = 0;
  let lastEvent = null;
  let lastResult = "—";

  function stamp() { return new Date().toLocaleTimeString("zh-CN", { hour12: false }); }
  function write(kind, message) {
    lines.unshift(`[${stamp()}] ${kind} ${message}`);
    if (lines.length > 80) lines.pop();
    log.textContent = lines.join("\n");
  }
  function environment() {
    const bridge = window.BarkBridge;
    const runtime = window.DrelRuntime || {};
    const context = window.WebBridgeKitLaunchContext || window.SuperCachePayload || {};
    facts.textContent = [
      `page: ${location.href}`,
      `bridge: ${bridge ? "present" : "missing"}`,
      `callNative: ${bridge ? typeof bridge.callNative : "missing"}`,
      `receiveEvent: ${bridge ? typeof bridge.receiveEvent : "missing"}`,
      `bridgeVersion: ${runtime.bridgeVersion ?? "unknown"}`,
      `appId: ${runtime.appId ?? runtime.applicationId ?? context.webbridgekitAppId ?? "unknown"}`,
      `offline: ${runtime.offlineMode ?? runtime.isOfflinePackage ?? context.webbridgekitOfflineMode ?? "unknown"}`,
      `events: ${eventCount}`,
      `lastResult: ${lastResult}`,
      `lastEvent: ${lastEvent ? JSON.stringify(lastEvent) : "—"}`
    ].join("\n");
  }
  async function call(action, params) {
    environment();
    if (!window.BarkBridge || typeof window.BarkBridge.callNative !== "function") {
      lastResult = "BarkBridge.callNative unavailable";
      write("ERROR", lastResult);
      environment();
      return null;
    }
    write("CALL", `${action} ${JSON.stringify(params || {})}`);
    try {
      const result = await window.BarkBridge.callNative("sensors", { action, ...(params || {}) });
      const payload = result && typeof result === "object" && "data" in result
        ? result.data
        : result;
      lastResult = `success ${JSON.stringify(payload ?? {})}`;
      write("OK", lastResult);
      environment();
      return result;
    } catch (error) {
      lastResult = `error ${error && error.message ? error.message : String(error)}`;
      write("ERROR", lastResult);
      environment();
      return null;
    }
  }
  function received(event, data) {
    eventCount++;
    lastEvent = { event, data, at: Date.now() };
    if (eventCount === 1 || eventCount % 20 === 0) {
      write("EVENT", `${event} #${eventCount} ${JSON.stringify(data)}`);
    }
    environment();
  }
  function open(force) {
    const shouldOpen = force ?? panel.classList.contains("hidden");
    panel.classList.toggle("hidden", !shouldOpen);
    if (shouldOpen) environment();
  }
  function simulate(value) {
    const sensor = window.GyroSensorDebug;
    if (!sensor || typeof sensor.simulate !== "function") {
      lastResult = "GyroSensorDebug unavailable";
      write("ERROR", lastResult);
      environment();
      return;
    }
    sensor.simulate(value);
    lastResult = `synthetic tilt ${value}`;
    write("SIM", lastResult);
    environment();
  }
  document.getElementById("btnDebug").addEventListener("click", () => open());
  document.getElementById("debugRefresh").addEventListener("click", () => { environment(); write("INFO", "环境已刷新"); });
  document.getElementById("debugStatus").addEventListener("click", () => call("", {}));
  document.getElementById("debugStart").addEventListener("click", () => call("startAccelerometer", { interval: 0.033 }));
  document.getElementById("debugStop").addEventListener("click", () => call("stopAccelerometer", {}));
  document.getElementById("debugSimLeft").addEventListener("click", () => simulate(-1));
  document.getElementById("debugSimCenter").addEventListener("click", () => simulate(0));
  document.getElementById("debugSimRight").addEventListener("click", () => simulate(1));
  document.getElementById("debugClear").addEventListener("click", () => { lines.length = 0; log.textContent = ""; });
  document.getElementById("debugClose").addEventListener("click", () => open(false));
  setTimeout(environment, 0);
  setTimeout(environment, 800);
  return { open, write, environment, call, received, simulate, count: () => eventCount };
})();
/* ============ 传感器层（Bridge 版）============ */
const Sensor = (() => {
  // 调用约定与 Action Demo 一致：window.BarkBridge.callNative(action, params)
  // （运行时注入的 Promise 封装，投递给小写 barkBridge handler）。
  // 传感器订阅必须在用户手势后发起：本层由「开始游戏」点击触发。
  const chip = document.getElementById("sensorChip");
  const hzChip = document.getElementById("hzChip");
  const btnCal = document.getElementById("btnCal");
  const state = { source: "none", hz: 0 };
  let hzCount = 0;
  let baseline = null, samples = [], calibrating = false, calibrated = false;
  let tilt = 0, tiltSmooth = 0, raw = 0;

  function setChip(text, cls) { chip.textContent = text; chip.className = "chip " + cls; }

  // 事件流由原生 evaluateJavaScript 调 receiveEvent 送达——只做增量挂载，
  // 绝不覆盖运行时注入的 BarkBridge 对象（callNative/_callbacks 都在里面）。
  function attachEventSink() {
    if (window.BarkBridge) {
      window.BarkBridge.receiveEvent = onBridgeEvent;
      Debug.write("INFO", "receiveEvent 已挂载");
      Debug.environment();
      return true;
    }
    let tries = 0;
    const t = setInterval(() => {
      tries++;
      if (window.BarkBridge) {
        window.BarkBridge.receiveEvent = onBridgeEvent;
        Debug.write("INFO", `receiveEvent 已挂载（等待 ${tries * 50}ms）`);
        Debug.environment();
        clearInterval(t);
      } else if (tries > 100) {
        Debug.write("ERROR", "等待 BarkBridge 超时");
        clearInterval(t);
      }
    }, 50);
    return false;
  }
  function onBridgeEvent(event, data) {
    if (event === "onSensorsAccessRevoked") {
      Debug.received(event, data);
      state.source = "none";
      baseline = null;
      calibrated = false;
      calibrating = false;
      tilt = 0;
      tiltSmooth = 0;
      raw = 0;
      setChip("传感器权限已撤销 → 触屏模式", "bad");
      return;
    }
    if (event !== "onAccelerometerChange") return;
    Debug.received(event, data);
    if (state.source === "none") { state.source = "bridge"; setChip("Bridge 加速度计 ✓ 等待校准", "ok"); }
    hzCount++;
    const x = typeof data.x === "number" ? data.x : 0;
    feed(x);
  }

  function feed(x) { // 重力加速度 x 分量（G）：端平≈0，右倾为正；任意握持姿势有效
    raw = x;
    if (calibrating) {
      samples.push(x);
      if (samples.length >= 30) {
        const mean = samples.reduce((a, b) => a + b, 0) / samples.length;
        const spread = Math.sqrt(samples.reduce((a, b) => a + (b - mean) * (b - mean), 0) / samples.length);
        if (spread < 0.045) {
          baseline = mean; calibrated = true; calibrating = false;
          setChip("Bridge 加速度计 ✓ 已校准", "ok");
        } else { samples.shift(); }
      }
    }
    if (baseline !== null) {
      const d = x - baseline;
      const dz = 0.04, full = 0.38;
      tilt = Math.abs(d) < dz ? 0 : Math.max(-1, Math.min(1, (d - Math.sign(d) * dz) / full));
    }
  }
  function startCalibration() {
    samples = []; calibrated = false; calibrating = true;
    setChip("校准中：手机端平拿稳 1 秒…", "dim");
  }

  async function enable() {
    attachEventSink();
    setChip("Bridge sensors 订阅中…", "dim");
    const res = await Debug.call("startAccelerometer", { interval: 0.033 });
    if (res) {
      setChip("Bridge 加速度计 ✓ 等待校准", "ok");
      setTimeout(() => { if (!calibrated && !calibrating) startCalibration(); }, 600);
      return res;
    }
    setChip("Bridge sensors 不可用 → 触屏模式", "bad");
    Debug.open(true);
    return null;
  }

  setInterval(() => {
    state.hz = hzCount; hzCount = 0;
    if (state.source !== "none") {
      hzChip.classList.remove("hidden");
      hzChip.textContent = state.hz + "Hz" +
        (baseline !== null ? " x" + raw.toFixed(2) + "G/b" + baseline.toFixed(2) + "G/" + Math.round(tilt * 100) + "%" : "");
    }
  }, 1000);
  btnCal.addEventListener("click", startCalibration);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && window.BarkBridge && window.BarkBridge.callNative) {
      Debug.call("stopAccelerometer", {});
    }
  });

  return {
    enable,
    startCalibration,
    simulate: (value) => {
      const normalized = Math.max(-1, Math.min(1, Number(value) || 0));
      baseline = 0;
      calibrated = true;
      calibrating = false;
      state.source = "simulated";
      feed(normalized * 0.38);
      setChip(`模拟倾斜 ${normalized > 0 ? "右" : normalized < 0 ? "左" : "回中"}`, "ok");
      Debug.write("INFO", `模拟倾斜 ${normalized.toFixed(2)}`);
      Debug.environment();
    },
    value: () => {
      if ((state.source !== "bridge" && state.source !== "simulated") || !calibrated) return null;
      tiltSmooth += (tilt - tiltSmooth) * 0.35;
      return tiltSmooth;
    },
    source: () => state.source,
  };
})();
window.GyroSensorDebug = Sensor;

/* ============ 触屏兜底（两版共用）============ */
const Touch = (() => {
  let active = false, side = 0;
  addEventListener("touchstart", (e) => { active = true; side = e.touches[0].clientX < innerWidth / 2 ? -1 : 1; }, { passive: true });
  addEventListener("touchmove", (e) => { side = e.touches[0].clientX < innerWidth / 2 ? -1 : 1; }, { passive: true });
  addEventListener("touchend", () => { active = false; }, { passive: true });
  return { value: () => active ? side : null };
})();

/* ============ 游戏内核（两版共用）============ */
(() => {
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const scoreEl = document.getElementById("score");
  const btnStart = document.getElementById("btnStart");
  const btnSensor = document.getElementById("btnSensor");
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 3);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize); resize();

  let running = false, raf = 0, last = 0;
  let px = 0.5, obstacles = [], score = 0, best = 0, elapsed = 0, spawnIn = 0, dead = false;
  try { best = Number(localStorage.getItem("gyro-bridge-best") || 0); } catch (e) {}

  function reset() {
    px = 0.5; obstacles = []; score = 0; elapsed = 0; spawnIn = 0.4; dead = false;
    updateScore();
  }
  function updateScore() { scoreEl.textContent = "得分 " + Math.floor(score) + " · 最佳 " + Math.floor(best); }

  function input() {
    const t = Sensor.value(); if (t !== null) return t;
    const s = Touch.value(); if (s !== null) return s;
    return 0;
  }

  function step(dt) {
    elapsed += dt; score += dt * 10;
    px += input() * dt * 0.9;
    px = Math.max(0.07, Math.min(0.93, px));
    spawnIn -= dt;
    const interval = Math.max(0.32, 0.75 - elapsed * 0.01);
    if (spawnIn <= 0) {
      spawnIn = interval;
      const w = 0.10 + Math.random() * 0.14;
      obstacles.push({ x: Math.random() * (1 - w), w, y: -0.12, h: 0.045 + Math.random() * 0.05 });
    }
    const fall = 0.32 + elapsed * 0.012;
    for (const o of obstacles) o.y += fall * dt;
    obstacles = obstacles.filter((o) => o.y < 1.2);
    // 碰撞（飞船在 y≈0.86，半宽 0.045，半高 0.02）
    for (const o of obstacles) {
      const shipL = px - 0.045, shipR = px + 0.045;
      const shipT = 0.845, shipB = 0.885;
      if (o.x < shipR && o.x + o.w > shipL && o.y < shipB && o.y + o.h > shipT) { gameOver(); return; }
    }
    updateScore();
  }

  function gameOver() {
    dead = true; running = false;
    if (score > best) { best = score; try { localStorage.setItem("gyro-bridge-best", String(Math.floor(best))); } catch (e) {} }
    updateScore();
    overlay.querySelector("h1").textContent = "撞上了！";
    overlay.querySelector("p").innerHTML = "得分 " + Math.floor(score) + " · 最佳 " + Math.floor(best) +
      "<br>传感器：" + (Sensor.source() === "none" ? "未启用/不可用" : Sensor.source());
    btnStart.textContent = "再来一局";
    overlay.classList.remove("hidden");
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // 背景星
    ctx.fillStyle = "#141c38";
    for (let i = 0; i < 24; i++) {
      const sx = ((i * 197) % 100) / 100 * W;
      const sy = ((i * 131 + Math.floor(elapsed * 40 * (1 + i % 3))) % 100) / 100 * H;
      ctx.fillRect(sx, sy, 2, 2);
    }
    // 障碍
    ctx.fillStyle = "#f87171";
    for (const o of obstacles) {
      ctx.beginPath();
      ctx.roundRect(o.x * W, o.y * H, o.w * W, o.h * H, 6);
      ctx.fill();
    }
    // 飞船
    const sx = px * W, sy = 0.865 * H;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(input() * 0.25);
    ctx.fillStyle = "#8b5cf6";
    ctx.beginPath();
    ctx.moveTo(0, -16); ctx.lineTo(12, 14); ctx.lineTo(0, 8); ctx.lineTo(-12, 14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c4b5fd";
    ctx.fillRect(-4, 8, 8, 8 + Math.sin(elapsed * 30) * 4);
    ctx.restore();
  }

  function loop(ts) {
    if (!running) return;
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    step(dt); draw();
    raf = requestAnimationFrame(loop);
  }

  btnStart.addEventListener("click", () => {
    Debug.write("INFO", `开始游戏 source=${Sensor.source()}`);
    if (Sensor.source() === "none") { Sensor.enable(); }
    overlay.classList.add("hidden");
    reset(); running = true; last = performance.now();
    raf = requestAnimationFrame(loop);
  });
  btnSensor.addEventListener("click", () => Sensor.enable());
  document.addEventListener("visibilitychange", () => { if (document.hidden && running) { running = false; } });
  draw();
})();
</script>
</body>
</html>
