<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="bridge-fixtures.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
  <main>

    <h1>🧭 导航与状态</h1>
    <div id="statusBar" class="status-bar">检测中...</div>

    <div class="test-section">
        <h3>📜 历史记录</h3>
        <p>获取页面导航历史</p>
        <button class="btn-primary" onclick="callNative('getHistory', {})">getHistory</button>
    </div>

    <div class="test-section">
        <h3>📦 负载信息</h3>
        <p>获取页面传递的负载数据</p>
        <button class="btn-success" onclick="callNative('getPayload', {})">getPayload</button>
    </div>

    <div class="test-section">
        <h3>🪟 模态窗口</h3>
        <p>设置页面为模态或非模态</p>
        <div class="btn-grid">
            <button class="btn-warning" onclick="callNative('setModal', {modal:true,fullscreen:true})">setModal(fullscreen)</button>
            <button class="btn-warning" onclick="callNative('setModal', {modal:true,fullscreen:false})">setModal(non-fullscreen)</button>
        </div>
    </div>

    <div class="test-section">
        <h3>📄 缓存页面</h3>
        <p>获取已缓存的页面信息</p>
        <button class="btn-purple" onclick="callNative('page', {action:'getCachedPages'})">page(getCachedPages)</button>
    </div>

    <div class="log-section">
        <div id="logContainer"></div>
    </div>
  </main>
  <script src="bridge-fixtures.js"></script>
</body>
</html>
