<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="bridge-fixtures.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
  <main>

    <h1>💾 缓存调试</h1>
    <div id="statusBar" class="status-bar">检测中...</div>

    <div class="test-section">
        <h3>📊 缓存统计</h3>
        <p>查看缓存总体统计信息</p>
        <button class="btn-primary" onclick="callNative('cacheDebug', {action:'stats'})">cacheDebug(stats)</button>
    </div>

    <div class="test-section">
        <h3>📋 缓存规则</h3>
        <p>查看当前生效的缓存规则</p>
        <button class="btn-success" onclick="callNative('cacheDebug', {action:'rules'})">cacheDebug(rules)</button>
    </div>

    <div class="test-section">
        <h3>🔗 缓存 URL</h3>
        <p>查看已缓存的 URL 列表</p>
        <button class="btn-warning" onclick="callNative('cacheDebug', {action:'URLs'})">cacheDebug(URLs)</button>
    </div>

    <div class="test-section">
        <h3>🗑️ 清除缓存</h3>
        <p>清除所有缓存数据</p>
        <button class="btn-danger" onclick="callNative('cacheDebug', {action:'clear'})">cacheDebug(clear)</button>
    </div>

    <div class="log-section">
        <div id="logContainer"></div>
    </div>
  </main>
  <script src="bridge-fixtures.js"></script>
</body>
</html>
