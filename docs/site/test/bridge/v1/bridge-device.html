<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="bridge-fixtures.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
  <main>

    <h1>📱 设备功能</h1>
    <div id="statusBar" class="status-bar">检测中...</div>

    <div class="test-section">
        <h3>🖥️ 屏幕信息</h3>
        <p>获取设备屏幕属性</p>
        <button class="btn-primary" onclick="callNative('screen', {action:'getInfo'})">screen</button>
    </div>

    <div class="test-section">
        <h3>⚙️ 系统扩展</h3>
        <p>系统功能扩展调用</p>
        <div class="btn-grid">
            <button class="btn-success" onclick="callNative('systemExtra', {action:'badge'})">systemExtra(badge)</button>
            <button class="btn-success" onclick="callNative('systemExtra', {action:'flashlight'})">systemExtra(flashlight)</button>
            <button class="btn-success" onclick="callNative('systemExtra', {action:'faceID'})">systemExtra(faceID)</button>
        </div>
    </div>

    <div class="test-section">
        <h3>📡 传感器</h3>
        <p>设备传感器数据访问</p>
        <div class="btn-grid">
            <button class="btn-warning" onclick="callNative('sensors', {type:'accelerometer'})">sensors(accelerometer)</button>
            <button class="btn-warning" onclick="callNative('sensors', {type:'gyroscope'})">sensors(gyroscope)</button>
        </div>
    </div>

    <div class="test-section">
        <h3>🔗 连接能力</h3>
        <p>设备连接功能</p>
        <div class="btn-grid">
            <button class="btn-purple" onclick="callNative('mirroring')">mirroring</button>
            <button class="btn-teal" onclick="callNative('bluetooth')">bluetooth</button>
        </div>
    </div>

    <div class="log-section">
        <div id="logContainer"></div>
    </div>
  </main>
  <script src="bridge-fixtures.js"></script>
</body>
</html>
