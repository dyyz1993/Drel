<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="bridge-fixtures.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
  <main>

    <h1>📱 设备功能</h1>
    <div id="statusBar" class="status-bar">检测中...</div>

    <div class="test-section">
        <h3>🖥️ 屏幕信息</h3>
        <p>获取设备屏幕属性</p>
        <button class="btn-primary" onclick="callNative('screen', {action:'getInfo'})">screen</button>
    </div>

    <div class="test-section">
        <h3>⚙️ 系统扩展</h3>
        <p>系统功能扩展调用</p>
        <div class="btn-grid">
            <button class="btn-success" onclick="callNative('systemExtra', {action:'badge'})">systemExtra(badge)</button>
            <button class="btn-success" onclick="callNative('systemExtra', {action:'flashlight'})">systemExtra(flashlight)</button>
            <button class="btn-success" onclick="callNative('systemExtra', {action:'faceID'})">systemExtra(faceID)</button>
        </div>
    </div>

    <div class="test-section">
        <h3>📡 传感器</h3>
        <p>设备传感器数据访问</p>
        <div class="btn-grid">
            <button class="btn-warning" onclick="callNative('sensors', {type:'accelerometer'})">sensors(accelerometer)</button>
            <button class="btn-warning" onclick="callNative('sensors', {type:'gyroscope'})">sensors(gyroscope)</button>
        </div>
    </div>

    <div class="test-section">
        <h3>🔗 连接能力</h3>
        <p>设备连接功能</p>
        <div class="btn-grid">
            <button class="btn-purple" onclick="callNative('mirroring')">mirroring</button>
            <button class="btn-teal" onclick="callNative('bluetooth')">bluetooth</button>
        </div>
    </div>

    <div class="log-section">
        <div id="logContainer"></div>
    </div>
  </main>
    <script>
        function addLog(type, message, data) { /* same as bridge-permission */
            var logContainer = document.getElementById('logContainer');
            var time = new Date().toLocaleTimeString();
            var logClass = type === 'success' ? 'log-success' : type === 'error' ? 'log-error' : 'log-info';
            var div = document.createElement('div'); div.className = 'log-entry';
            div.innerHTML = '[' + time + '] [' + type.toUpperCase() + '] ' + message + (data ? ' ' + JSON.stringify(data) : '');
            logContainer.insertBefore(div, logContainer.firstChild);
            if (logContainer.children.length > 100) logContainer.removeChild(logContainer.lastChild);
        }
        function checkBridge() {
            var hasBridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.BarkBridge;
            var statusBar = document.getElementById('statusBar');
            if (hasBridge) { statusBar.className = 'status-bar ok'; statusBar.textContent = '✅ JS Bridge 可用'; addLog('success', 'JS Bridge 检测成功'); }
            else if (window.BarkBridge && window.BarkBridge.callNative) { statusBar.className = 'status-bar ok'; statusBar.textContent = '✅ BarkBridge 可用'; addLog('success', 'BarkBridge 检测成功'); }
            else { statusBar.className = 'status-bar error'; statusBar.textContent = '❌ JS Bridge 不可用'; addLog('error', 'JS Bridge 不可用'); }
            return hasBridge || (window.BarkBridge && typeof window.BarkBridge.callNative === 'function');
        }
        function callNative(action, params) {
            addLog('info', '调用: ' + action, params);
            try {
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.BarkBridge) {
                    window.webkit.messageHandlers.BarkBridge.postMessage({ action: action, params: params || {} });
                    addLog('info', '请求已发送 (webkit)');
                } else if (window.BarkBridge && window.BarkBridge.callNative) {
                    window.BarkBridge.callNative(action, params || {}).then(function(r) { addLog('success', '成功', r); }).catch(function(e) { addLog('error', '失败: ' + (e.message||e)); });
                    addLog('info', '请求已发送 (BarkBridge)');
                } else { addLog('error', 'Bridge 不可用'); }
            } catch(e) { addLog('error', '调用失败: ' + e.message); }
        }
        window.BarkBridge = window.BarkBridge || {};
        window.BarkBridge.receiveResult = function(result) {
            if (result.success) addLog('success', '成功', result.data);
            else addLog('error', '失败: ' + (result.error || 'Unknown'));
        };
        setTimeout(checkBridge, 100);
    </script>
</body>
</html>
