name: Build IPA

# Two modes:
#   push tag v*        → signed archive, export, and TestFlight upload
#   workflow_dispatch  → unsigned smoke archive (no credentials required)
#
# TestFlight mode needs these repository secrets:
#   WEBK_FRAMEWORK_TOKEN      read access to the private WebBridgeKit-Framework repo
#   BUILD_CERTIFICATE_BASE64  base64 of the CI .p12 (Apple Development + Distribution)
#   P12_PASSWORD              password of that .p12
#   KEYCHAIN_PASSWORD         any password; used for the ephemeral CI keychain
#   ASC_KEY_P8 / ASC_KEY_ID / ASC_ISSUER   App Store Connect API key for altool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

concurrency:
  group: drel-build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build and publish IPA
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show runner toolchain
        run: |
          xcodebuild -version
          sw_vers
          df -h /

      - name: Setup Project
        uses: ./.github/actions/setup-project
        env:
          WBK_FRAMEWORK_PATH: '../WebBridgeKit-Framework'
          WEBK_FRAMEWORK_TOKEN: ${{ secrets.WEBK_FRAMEWORK_TOKEN }}

      # ── Signed TestFlight path (tag pushes only) ──────────────────────────
      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${BUILD_CERTIFICATE_BASE64:-}" ]]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 secret is missing; cannot sign."
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing-${GITHUB_RUN_ID}.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_KEY_P8:-}" || -z "${ASC_KEY_ID:-}" ]]; then
            echo "::error::ASC_KEY_P8 / ASC_KEY_ID secrets are missing."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Resolve release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${TAG%%+*}"
          BUILD="${TAG##*+}"
          if [[ "$VERSION" == "$TAG" || -z "$BUILD" ]]; then
            echo "::error::Tag must look like v1.5.0+110 (got ${GITHUB_REF_NAME})."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing Drel $VERSION ($BUILD)"

      - name: Archive, export and upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          WBK_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          WBK_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER }}
          WBK_ASC_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          WBK_MARKETING_VERSION: ${{ steps.release.outputs.version }}
          WBK_SIGNING_KEYCHAIN: ${{ runner.temp }}/app-signing-${{ github.run_id }}.keychain-db
          WBK_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          bash tools/publish-drel-testflight.sh "${{ steps.release.outputs.build }}"

      # ── Unsigned smoke path (manual dispatch only) ────────────────────────
      - name: Build Archive (unsigned smoke)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Drel.xcworkspace \
            -scheme Drel \
            -configuration ${{ github.event.inputs.configuration }} \
            -archivePath build/Drel.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -resultBundlePath build/ArchiveResults.xcresult \
            | xcpretty --color

      - name: Export IPA (unsigned smoke)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p build/Payload
          cp -r build/Drel.xcarchive/Products/Applications/Drel.app build/Payload/
          cd build
          zip -r Drel.ipa Payload/

      - name: Upload smoke artifact
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Drel-unsigned-${{ github.event.inputs.configuration }}
          path: build/Drel.ipa
          retention-days: 1

      # The signed IPA went to TestFlight above; keep the upload record for
      # forensics and never attach a signed IPA to a public GitHub release.
      - name: Upload signed upload record
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Drel-signed-${{ github.ref_name }}
          path: build/*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing-${GITHUB_RUN_ID}.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -d "$RUNNER_TEMP/private_keys" ]]; then
            find "$RUNNER_TEMP/private_keys" -type f -delete
          fi
          if [[ -f "$RUNNER_TEMP/build_certificate.p12" ]]; then
            rm -f "$RUNNER_TEMP/build_certificate.p12"
          fi
