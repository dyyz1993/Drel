name: Build IPA

# Two modes:
#   push tag v*        → signed archive, export, and TestFlight upload
#   workflow_dispatch  → unsigned smoke archive (no credentials required)
#
# TestFlight mode needs these repository secrets:
#   WEBK_FRAMEWORK_TOKEN      read access to the private WebBridgeKit-Framework repo
#   ASC_KEY_P8 / ASC_KEY_ID / ASC_ISSUER   App Store Connect API key for altool
#
# Signing uses the runner's login keychain directly (self-hosted runner on a
# trusted machine that keeps the current Apple Development + Distribution
# identities and WebBridgeKit App Store provisioning profiles installed).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

concurrency:
  group: drel-build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    if: github.repository == 'dyyz1993/Drel'
    name: Build and publish IPA
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show runner toolchain
        run: |
          xcodebuild -version
          sw_vers
          df -h /

      - name: Setup Project
        uses: ./.github/actions/setup-project
        env:
          WBK_FRAMEWORK_PATH: '../WebBridgeKit-Framework'
          WEBK_FRAMEWORK_TOKEN: ${{ secrets.WEBK_FRAMEWORK_TOKEN }}

      # ── Signed TestFlight path (tag pushes only) ──────────────────────────
      - name: Write App Store Connect API key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_KEY_P8:-}" || -z "${ASC_KEY_ID:-}" ]]; then
            echo "::error::ASC_KEY_P8 / ASC_KEY_ID secrets are missing."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Resolve release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${TAG%%+*}"
          BUILD="${TAG##*+}"
          if [[ "$VERSION" == "$TAG" || -z "$BUILD" ]]; then
            echo "::error::Tag must look like v1.5.0+110 (got ${GITHUB_REF_NAME})."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing Drel $VERSION ($BUILD)"

      - name: Unlock login keychain for signing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          LOGIN_KEYCHAIN_PASSWORD: ${{ secrets.LOGIN_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${LOGIN_KEYCHAIN_PASSWORD:-}" ]]; then
            echo "::error::LOGIN_KEYCHAIN_PASSWORD secret is missing."
            exit 1
          fi
          security unlock-keychain -p "$LOGIN_KEYCHAIN_PASSWORD" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$LOGIN_KEYCHAIN_PASSWORD" login.keychain-db >/dev/null
          security show-keychain-info login.keychain-db
          echo "login keychain unlocked and codesign partition authorized"

      - name: Debug signing context (runner session)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -uo pipefail
          echo "── keychain search list ──"
          security list-keychains -d user
          echo "── default keychain ──"
          security default-keychain
          echo "── login keychain lock state ──"
          security show-keychain-info login.keychain-db 2>&1 || true
          echo "── valid identities ──"
          security find-identity -v -p codesigning | sed -n '1,8p'
          echo "── probe distribution sign ──"
          cp /bin/echo /tmp/_sigtest_dist
          codesign --force --sign A3C0DCDF6570C81A052C8A4BD0A7795382E0055E /tmp/_sigtest_dist \
            && echo "DIST SIGN OK" || echo "DIST SIGN FAILED: $?"
          echo "── probe development sign ──"
          cp /bin/echo /tmp/_sigtest_dev
          codesign --force --sign 4CA215A1364F9CEFED0024B178E415D3566A12AC /tmp/_sigtest_dev \
            && echo "DEV SIGN OK" || echo "DEV SIGN FAILED: $?"

      - name: Archive, export and upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          WBK_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          WBK_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER }}
          WBK_ASC_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          WBK_MARKETING_VERSION: ${{ steps.release.outputs.version }}
          WBK_ARCHIVE_SIGNING: project
        run: |
          set -euo pipefail
          bash tools/publish-drel-testflight.sh "${{ steps.release.outputs.build }}"

      # ── Unsigned smoke path (manual dispatch only) ────────────────────────
      - name: Build Archive (unsigned smoke)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Drel.xcworkspace \
            -scheme Drel \
            -configuration ${{ github.event.inputs.configuration }} \
            -archivePath build/Drel.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -resultBundlePath build/ArchiveResults.xcresult \
            | xcpretty --color

      - name: Export IPA (unsigned smoke)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p build/Payload
          cp -r build/Drel.xcarchive/Products/Applications/Drel.app build/Payload/
          cd build
          zip -r Drel.ipa Payload/

      - name: Upload smoke artifact
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Drel-unsigned-${{ github.event.inputs.configuration }}
          path: build/Drel.ipa
          retention-days: 1

      # The signed IPA went to TestFlight above; keep the upload record for
      # forensics and never attach a signed IPA to a public GitHub release.
      - name: Upload signed upload record
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Drel-signed-${{ github.ref_name }}
          path: build/*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing-${GITHUB_RUN_ID}.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -d "$RUNNER_TEMP/private_keys" ]]; then
            find "$RUNNER_TEMP/private_keys" -type f -delete
          fi
          if [[ -f "$RUNNER_TEMP/build_certificate.p12" ]]; then
            rm -f "$RUNNER_TEMP/build_certificate.p12"
          fi
