name: Design Lint

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  design-lint:
    if: github.repository == 'dyyz1993/Drel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Design System Lint
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Design Lint
        run: bash tools/design-lint.sh --ci --verbose
