name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CI_START_TIME: ${{ github.event.head_commit.timestamp }}

jobs:
  # ─── Job 1: SwiftLint ───────────────────────────────────────────
  swiftlint:
    if: github.repository == 'dyyz1993/Drel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: SwiftLint
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Homebrew
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips hosted cache storage.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-swiftlint

      - name: Run SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --config .swiftlint.yml --reporter github-actions-logging SuperApp/Sources/ NotificationServiceExtension/

  # ─── Job 2: Build ───────────────────────────────────────────────
  build:
    if: github.repository == 'dyyz1993/Drel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Build
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The shell verification gates (deliverable boundaries, template gate,
      # design lint) rely on ripgrep.
      - name: Install ripgrep
        run: brew install ripgrep

      - name: Setup Project
        uses: ./.github/actions/setup-project
        env:
          WBK_FRAMEWORK_PATH: ${{ vars.WBK_FRAMEWORK_PATH || '../WebBridgeKit-Framework' }}

      - name: Reclaim self-hosted build disk
        shell: bash
        run: python3 -c 'import shutil; shutil.rmtree("/tmp/wbk-rel-gate", ignore_errors=True); shutil.rmtree("build/BuildResults.xcresult", ignore_errors=True); shutil.rmtree("build/DerivedData", ignore_errors=True)'

      - name: Verify deliverable boundaries
        run: bash tools/verify-deliverable-boundaries.sh

      - name: Build Drel App
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Drel.xcworkspace \
            -derivedDataPath build/DerivedData \
            -scheme Drel \
            -sdk iphonesimulator \
            -arch arm64 \
            -configuration Debug \
            -resultBundlePath build/BuildResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Upload Build Artifacts
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-results
          path: |
            build/BuildResults.xcresult
          retention-days: 7

      - name: Upload DerivedData
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: derived-data
          path: ~/Library/Developer/Xcode/DerivedData/Drel-*/
          retention-days: 1

      - name: Reclaim build outputs
        if: always()
        shell: bash
        run: python3 -c 'import shutil; shutil.rmtree("build/DerivedData", ignore_errors=True); shutil.rmtree("build/BuildResults.xcresult", ignore_errors=True)'

  # ─── Job 3: Smoke Tests (with retry) ────────────────────────────
  smoke-tests:
    if: github.repository == 'dyyz1993/Drel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Drel Smoke Tests
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 30
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download DerivedData
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: derived-data
          path: ~/Library/Developer/Xcode/DerivedData/

      - name: Setup Project
        uses: ./.github/actions/setup-project
        env:
          WBK_FRAMEWORK_PATH: ${{ vars.WBK_FRAMEWORK_PATH || '../WebBridgeKit-Framework' }}

      - name: Cleanup & Prepare Simulator
        id: prep
        run: |
          set -euo pipefail
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          sleep 2
          xcodebuild -version
          # Drel is an iPhone app: prefer an iPhone simulator, because other
          # projects' iPad simulators can be listed first on a shared runner.
          DESTINATION="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[device for group in data.get("devices",{}).values() for device in group if device.get("isAvailable") and device.get("udid")]; phones=[device for device in devices if "iPhone" in device.get("deviceTypeIdentifier","")]; pick=(phones or devices)[0] if (phones or devices) else None; print("id=" + pick["udid"] if pick else "")')"
          if [ -z "$DESTINATION" ]; then
            echo "::error::No available iOS Simulator device"
            exit 1
          fi
          echo "Using $DESTINATION"
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"
      - name: Run Smoke Tests (retry 3x)
        env:
          CI: "true"
        run: |
          set -o pipefail
          mkdir -p build/test-results
          DESTINATION="${{ steps.prep.outputs.destination }}"

          for ATTEMPT in 1 2 3; do
            echo "=== Smoke test attempt $ATTEMPT/3 ==="
            rm -rf build/test-results/SmokeResults-*.xcresult 2>/dev/null || true

            if xcodebuild test \
              -workspace Drel.xcworkspace \
              -derivedDataPath build/DerivedData \
              -scheme Drel \
              -destination "$DESTINATION" \
              -configuration Debug \
              -resultBundlePath "build/test-results/SmokeResults-attempt-${ATTEMPT}.xcresult" \
              -only-testing:DrelUITests/DrelSmokeTests \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty --color --report junit --output build/test-results/smoke-junit.xml; then
              echo "✅ Smoke tests passed on attempt $ATTEMPT"
              mv "build/test-results/SmokeResults-attempt-${ATTEMPT}.xcresult" build/test-results/SmokeResults.xcresult 2>/dev/null || true
              exit 0
            fi

            echo "⚠️ Attempt $ATTEMPT failed"
            xcrun simctl shutdown all 2>/dev/null || true
            sleep 5
          done

          echo "❌ Smoke tests failed after 3 attempts"
          exit 1

      - name: Upload Test Results
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-test-results
          path: build/test-results/
          retention-days: 14

      - name: Collect Screenshots
        if: always()
        run: |
          mkdir -p screenshots
          find build/test-results -name "*.png" -exec cp {} screenshots/ \; 2>/dev/null || true
          find ~/Library/Developer/Xcode/DerivedData -name "*.png" -exec cp {} screenshots/ \; 2>/dev/null || true
          BOOTED_ID=$(xcrun simctl list devices booted -j 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);print(list(d.get('devices',{}).values())[0][0].get('udid',''))" 2>/dev/null || echo "")
          [ -n "$BOOTED_ID" ] && xcrun simctl io "$BOOTED_ID" screenshot screenshots/smoke_final.png 2>/dev/null || true

      - name: Upload Screenshots
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-smoke-tests
          path: screenshots/
          retention-days: 14

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        with:
          report_paths: build/test-results/smoke-junit.xml
          check_name: "Smoke Test Results"

      - name: Capture Diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          xcrun simctl diagnose --output diagnostics/ 2>/dev/null || true
          BOOTED_ID=$(xcrun simctl list devices booted -j 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);ids=[dv.get('udid','') for devs in d.get('devices',{}).values() for dv in devs if dv.get('state')=='Booted'];print(ids[0] if ids else '')" 2>/dev/null || echo "")
          if [ -n "$BOOTED_ID" ]; then
            xcrun simctl spawn "$BOOTED_ID" log show --last 2m 2>/dev/null > diagnostics/sim-device.log || true
          fi

      - name: Upload Diagnostics
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-diagnostics
          path: diagnostics/
          retention-days: 7

      - name: Cleanup Simulators
        if: always()
        run: xcrun simctl shutdown all 2>/dev/null || true

      - name: Scan Crash Logs
        if: always()
        run: bash scripts/scan-crash-logs.sh --json || true

      - name: Upload Crash Logs
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-logs-smoke
          path: |
            ~/Library/Logs/DiagnosticReports/Drel*.ips
          retention-days: 7
          if-no-files-found: ignore

      - name: Reclaim smoke-test disk
        if: always()
        shell: bash
        run: python3 -c 'import shutil; shutil.rmtree("build/test-results", ignore_errors=True); shutil.rmtree("build/DerivedData", ignore_errors=True)'

  # ─── Job 4: UI Fidelity Tests (with retry) ──────────────────────
  ui-fidelity:
    if: github.repository == 'dyyz1993/Drel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Drel UI Fidelity Tests
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 30
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download DerivedData
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: derived-data
          path: ~/Library/Developer/Xcode/DerivedData/

      - name: Setup Project
        uses: ./.github/actions/setup-project
        env:
          WBK_FRAMEWORK_PATH: ${{ vars.WBK_FRAMEWORK_PATH || '../WebBridgeKit-Framework' }}

      - name: Cleanup & Prepare Simulator
        id: prep
        run: |
          set -euo pipefail
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          sleep 2
          xcodebuild -version
          # Drel is an iPhone app: prefer an iPhone simulator, because other
          # projects' iPad simulators can be listed first on a shared runner.
          DESTINATION="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[device for group in data.get("devices",{}).values() for device in group if device.get("isAvailable") and device.get("udid")]; phones=[device for device in devices if "iPhone" in device.get("deviceTypeIdentifier","")]; pick=(phones or devices)[0] if (phones or devices) else None; print("id=" + pick["udid"] if pick else "")')"
          if [ -z "$DESTINATION" ]; then
            echo "::error::No available iOS Simulator device"
            exit 1
          fi
          echo "Using $DESTINATION"
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"
      - name: Run UI Fidelity Tests (retry 3x)
        env:
          CI: "true"
        run: |
          set -o pipefail
          mkdir -p build/screenshots/actual build/test-results
          DESTINATION="${{ steps.prep.outputs.destination }}"

          for ATTEMPT in 1 2 3; do
            echo "=== UI fidelity attempt $ATTEMPT/3 ==="
            rm -rf build/test-results/UIFidelityResults-*.xcresult 2>/dev/null || true

            if xcodebuild test \
              -workspace Drel.xcworkspace \
              -derivedDataPath build/DerivedData \
              -scheme Drel \
              -destination "$DESTINATION" \
              -configuration Debug \
              -resultBundlePath "build/test-results/UIFidelityResults-attempt-${ATTEMPT}.xcresult" \
              -only-testing:DrelUITests/UIFidelityTests \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty --color --report junit --output build/test-results/ui-fidelity-junit.xml; then
              echo "✅ UI fidelity passed on attempt $ATTEMPT"
              mv "build/test-results/UIFidelityResults-attempt-${ATTEMPT}.xcresult" build/test-results/UIFidelityResults.xcresult 2>/dev/null || true
              exit 0
            fi

            echo "⚠️ Attempt $ATTEMPT failed"
            xcrun simctl shutdown all 2>/dev/null || true
            sleep 5
          done

          echo "❌ UI fidelity tests failed after 3 attempts"
          exit 1

      - name: Collect Screenshots
        if: always()
        run: |
          mkdir -p build/screenshots/actual
          if [ -d "build/test-results/UIFidelityResults.xcresult" ]; then
            find build/test-results/UIFidelityResults.xcresult -name "*.png" -exec cp {} build/screenshots/actual/ \; 2>/dev/null || true
          fi
          BOOTED_ID=$(xcrun simctl list devices booted -j 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);ids=[dv.get('udid','') for devs in d.get('devices',{}).values() for dv in devs if dv.get('state')=='Booted'];print(ids[0] if ids else '')" 2>/dev/null || echo "")
          [ -n "$BOOTED_ID" ] && xcrun simctl io "$BOOTED_ID" screenshot build/screenshots/actual/final_state.png 2>/dev/null || true

      - name: Check Reference Images
        id: references
        run: |
          if find docs/ui-fidelity/references -maxdepth 1 -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo "has_references=true" >> "$GITHUB_OUTPUT"
            echo "Found $(find docs/ui-fidelity/references -maxdepth 1 -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ') reference images"
          else
            echo "has_references=false" >> "$GITHUB_OUTPUT"
            echo "No reference images — saving current as baseline"
          fi

      - name: Save Baseline Screenshots
        if: steps.references.outputs.has_references == 'false'
        run: |
          mkdir -p docs/ui-fidelity/references
          if find build/screenshots/actual -maxdepth 1 -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            cp build/screenshots/actual/*.png docs/ui-fidelity/references/
            echo "Saved $(find docs/ui-fidelity/references -maxdepth 1 -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ') baseline images"
          fi

      - name: Run Diff Comparison
        if: steps.references.outputs.has_references == 'true'
        run: |
          chmod +x tools/diff-screenshots.sh
          OUTPUT_DIR=build/ui-fidelity-diff-report ./tools/diff-screenshots.sh \
            docs/ui-fidelity/references \
            build/screenshots/actual \
            build/ui-fidelity-diff-report \
            5 || true
          if [ -f "build/ui-fidelity-diff-report/results.json" ]; then
            cat build/ui-fidelity-diff-report/results.json
          fi

      - name: Upload Screenshots
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-fidelity-screenshots
          path: build/screenshots/actual/
          retention-days: 14

      - name: Upload Diff Report
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-fidelity-diff-report
          path: build/ui-fidelity-diff-report/
          retention-days: 14

      - name: Upload Test Results
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-fidelity-test-results
          path: build/test-results/UIFidelityResults.xcresult
          retention-days: 14

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        with:
          report_paths: build/test-results/ui-fidelity-junit.xml
          check_name: "UI Fidelity Test Results"

      - name: Fail on Diff Exceeding Threshold
        if: steps.references.outputs.has_references == 'true'
        run: |
          if [ -f "build/ui-fidelity-diff-report/results.json" ]; then
            python3 -c "
            import json, sys
            with open('build/ui-fidelity-diff-report/results.json') as f:
                data = json.load(f)
            failures = [r for r in data.get('results', []) if r.get('status') == 'FAIL']
            if failures:
                print(f'❌ {len(failures)} screenshot(s) exceeded diff threshold:')
                for f in failures:
                    print(f'   {f[\"name\"]}: {f[\"diff_percent\"]:.2f}%')
                sys.exit(1)
            else:
                print('✅ All screenshots within threshold')
            "
          fi

      - name: Cleanup Simulators
        if: always()
        run: xcrun simctl shutdown all 2>/dev/null || true

      - name: Scan Crash Logs
        if: always()
        run: bash scripts/scan-crash-logs.sh --json || true

      - name: Upload Crash Logs
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-logs-ui-fidelity
          path: |
            ~/Library/Logs/DiagnosticReports/Drel*.ips
          retention-days: 7
          if-no-files-found: ignore

      - name: Reclaim UI-test disk
        if: always()
        shell: bash
        run: python3 -c 'import shutil; shutil.rmtree("build/test-results", ignore_errors=True); shutil.rmtree("build/DerivedData", ignore_errors=True); shutil.rmtree("build/screenshots", ignore_errors=True)'

  # ─── Job 5: Design System Lint ──────────────────────────────────
  design-lint:
    if: github.repository == 'dyyz1993/Drel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: 🎨 Design System Lint
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Fetch WebBridgeKit Framework
        shell: bash
        env:
          WBK_FRAMEWORK_PATH: ${{ vars.WBK_FRAMEWORK_PATH || '../WebBridgeKit-Framework' }}
        run: |
          set -euo pipefail
          # ci-lint.sh deliverable-boundaries resolves the shared push wire
          # contract through the public sibling framework checkout; fetch it
          # the same way setup-project does instead of depending on residue
          # from whichever job ran before this one on the runner.
          python3 -c 'import shutil,os; shutil.rmtree("../WebBridgeKit-Framework") if os.path.exists("../WebBridgeKit-Framework") else None'
          FRAMEWORK_URL="https://github.com/dyyz1993/WebBridgeKit-Framework.git"
          PINNED_FRAMEWORK_REVISION="$(cat framework-revision.txt)"
          git init -q "$WBK_FRAMEWORK_PATH"
          git -C "$WBK_FRAMEWORK_PATH" remote add origin "$FRAMEWORK_URL"
          git -C "$WBK_FRAMEWORK_PATH" fetch --depth 1 origin "$PINNED_FRAMEWORK_REVISION"
          git -C "$WBK_FRAMEWORK_PATH" checkout --detach FETCH_HEAD
          ACTUAL_FRAMEWORK_REVISION="$(git -C "$WBK_FRAMEWORK_PATH" rev-parse HEAD)"
          [[ "$ACTUAL_FRAMEWORK_REVISION" == "$PINNED_FRAMEWORK_REVISION" ]] || {
            echo "::error::Framework revision does not match the pinned release revision"
            exit 1
          }
      - name: Run Design System Lint
        run: bash tools/ci-lint.sh

  # ─── Job 8: Repository Conventions ───────────────────────────────
  # The documentation, changelog, website and repository hygiene rules.
  # These checks do not need Xcode; they fail fast and give a contributor the
  # reason without waiting for the application build.
  repo-conventions:
    if: github.repository == 'dyyz1993/Drel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: 📋 Repository Conventions
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    # Mermaid rendering runs one Chrome launch per diagram (~2 min each with
    # a cold npm exec); give the eight diagrams headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Repository hygiene (no large files, no credentials)
        run: python3 tools/verify-repo-hygiene.py --check-history

      - name: Documentation links resolve
        run: python3 tools/verify-docs-links.py

      - name: Changelog and release records agree
        run: python3 tools/verify-release-notes.py

      - name: Diagram sources are rendered (Mermaid)
        env:
          npm_config_cache: ${{ runner.temp }}/drel-mermaid-npm-cache
          # The runner LaunchAgent exports HTTP(S)_PROXY; handing that proxy
          # to the local-file Chromium render: diagrams come from local files,
          # so the render needs no proxy.
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
        run: bash tools/build-drel-diagrams.sh --check

      - name: Build the website
        env:
          DREL_SKIP_DIAGRAMS: "1"
        run: bash tools/build-drel-site.sh

      - name: Website links, demos and asset digests
        run: python3 tools/verify-drel-site.py --dir build/drel-site-staging

      - name: Developer API versions, schemas and secret scan
        run: python3 tools/verify-drel-developer-docs.py

      - name: Push discovery and dispatch regression
        run: node --test infra/cloudflare/drel-api-proxy/test/official-push.test.js

      - name: Upload site staging output
        if: github.event_name == 'workflow_dispatch'  # PR/push CI skips quota-blocked artifact storage.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drel-site-staging
          path: build/drel-site-staging
          retention-days: 7
          if-no-files-found: warn

  # ─── Job 6: Release Purity (DEBUG-only code must not ship) ────
  # Builds Release and scans the binary for DEBUG-only markers, plus the
  # architecture-lint Rule 9 (DEBUG-only files must be file-level #if DEBUG).
  release-purity:
    if: github.repository == 'dyyz1993/Drel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: 🔒 Release Purity
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Project
        uses: ./.github/actions/setup-project
        env:
          WBK_FRAMEWORK_PATH: ${{ vars.WBK_FRAMEWORK_PATH || '../WebBridgeKit-Framework' }}

      - name: Verify Release binary has no DEBUG-only code
        run: bash tools/verify-release-no-debug.sh

      - name: Architecture lint (includes DEBUG-wrap Rule 9)
        run: bash tools/architecture-lint.sh

      - name: Reclaim release-gate disk
        if: always()
        shell: bash
        run: python3 -c 'import shutil; shutil.rmtree("/tmp/wbk-rel-gate", ignore_errors=True)'
