name: Deploy Drel API Worker

on:
  pull_request:
    paths:
      - "infra/cloudflare/drel-api-proxy/**"
      - ".github/workflows/deploy-drel-api-proxy.yml"
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/drel-api-proxy/**"
      - ".github/workflows/deploy-drel-api-proxy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    defaults:
      run:
        working-directory: infra/cloudflare/drel-api-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test
      - run: npm run check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    defaults:
      run:
        working-directory: infra/cloudflare/drel-api-proxy
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WBK_APPROVAL_URL: https://api.drel.app
      WBK_APPROVAL_DEVICE_KEY: approval-deploy-gate
      WBK_APPROVAL_REGISTER_DEVICE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: credentials
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.configured == 'true'
        run: npm run deploy
      - if: steps.credentials.outputs.configured == 'true'
        run: bash ../../tools/verify-approval-v1.sh
      - if: steps.credentials.outputs.configured != 'true'
        run: |
          echo "Cloudflare deployment skipped: configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as GitHub Actions secrets."
