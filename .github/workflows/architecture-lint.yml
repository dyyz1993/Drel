name: Architecture Lint

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture-lint:
    if: github.repository == 'dyyz1993/Drel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Architecture Lint
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Architecture Lint
        run: bash tools/architecture-lint.sh --ci
