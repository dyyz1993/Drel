name: Architecture Lint

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture-lint:
    name: Architecture Lint
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Architecture Lint
        run: bash tools/architecture-lint.sh --ci
