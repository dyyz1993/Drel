name: Self-hosted Runner Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/self-hosted-smoke.yml

permissions:
  contents: read

concurrency:
  group: drel-self-hosted-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.repository == 'dyyz1993/Drel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Validate drel-ios runner
    runs-on: [self-hosted, macOS, ARM64, drel-ios]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check toolchain and capacity
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          xcodebuild -version
          for tool in git ruby xcodegen swiftlint pod; do
            printf '%-12s' "$tool"
            command -v "$tool"
          done
          df -h /

