name: 'Setup Xcode Project'
description: 'Install deps, generate project, pod install, and ensure formatter tooling exists'
runs:
  using: 'composite'
  # Consume the caller's env directly; composite run steps can access env.
  steps:
    - name: Cache Homebrew
      id: cache-brew
      if: github.event_name == 'workflow_dispatch'  # PR/push CI skips hosted cache storage.
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-xcodegen-swiftlint

    - name: Install xcodegen & swiftlint
      if: steps.cache-brew.outputs.cache-hit != 'true'
      shell: bash
      run: brew install xcodegen swiftlint

    - name: Ensure CLI tooling available
      shell: bash
      run: |
        GEM_BIN="$(ruby -e 'print Gem.user_dir')/bin"
        mkdir -p "$GEM_BIN"
        echo "$GEM_BIN" >> "$GITHUB_PATH"
        export PATH="$GEM_BIN:$PATH"
        command -v xcodegen || brew install xcodegen
        command -v swiftlint || brew install swiftlint
        command -v pod >/dev/null || gem install --user-install cocoapods --no-document
        command -v xcpretty >/dev/null || gem install --user-install xcpretty --no-document

    - name: Cache CocoaPods
      if: github.event_name == 'workflow_dispatch'  # PR/push CI skips hosted cache storage.
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: Pods
        key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
        restore-keys: pods-${{ runner.os }}-

    - name: Cache DerivedData
      if: github.event_name == 'workflow_dispatch'  # PR/push CI skips hosted cache storage.
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: derived-${{ runner.os }}-xcode16.4-${{ hashFiles('Podfile.lock', 'project.yml') }}
        restore-keys: derived-${{ runner.os }}-xcode16.4-

    - name: Fetch WebBridgeKit Framework
      shell: bash
      run: |
        set -euo pipefail
        # xcodegen validates framework source paths while generating the project,
        # so the framework must exist before generation. It is public, so fetch it
        # anonymously. The pinned commit is fetched directly, so a new commit on
        # the framework's main branch does not break this build until the pin is
        # moved on purpose.
        python3 -c 'import shutil,os; shutil.rmtree("../WebBridgeKit-Framework") if os.path.exists("../WebBridgeKit-Framework") else None'
        FRAMEWORK_URL="https://github.com/dyyz1993/WebBridgeKit-Framework.git"
        PINNED_FRAMEWORK_REVISION="$(cat framework-revision.txt)"
        git init -q ../WebBridgeKit-Framework
        git -C ../WebBridgeKit-Framework remote add origin "$FRAMEWORK_URL"
        git -C ../WebBridgeKit-Framework fetch --depth 1 origin "$PINNED_FRAMEWORK_REVISION"
        git -C ../WebBridgeKit-Framework checkout --detach FETCH_HEAD
        ACTUAL_FRAMEWORK_REVISION="$(git -C ../WebBridgeKit-Framework rev-parse HEAD)"
        [[ "$ACTUAL_FRAMEWORK_REVISION" == "$PINNED_FRAMEWORK_REVISION" ]] || {
          echo "::error::Framework revision does not match the pinned release revision"
          exit 1
        }
    - name: Generate & Install
      shell: bash
      run: |
        xcodegen generate --spec project.yml --project .
    - name: Install Pods
      shell: bash
      run: pod install
