name: 'Setup Xcode Project'
description: 'Install deps, generate project, pod install, and ensure formatter tooling exists'
runs:
  using: 'composite'
  # Consume the caller's env directly; composite run steps can access env.
  steps:
    - name: Cache Homebrew
      id: cache-brew
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-xcodegen-swiftlint

    - name: Install xcodegen & swiftlint
      if: steps.cache-brew.outputs.cache-hit != 'true'
      shell: bash
      run: brew install xcodegen swiftlint

    - name: Ensure CLI tooling available
      shell: bash
      run: |
        GEM_BIN="$(ruby -e 'print Gem.user_dir')/bin"
        mkdir -p "$GEM_BIN"
        echo "$GEM_BIN" >> "$GITHUB_PATH"
        export PATH="$GEM_BIN:$PATH"
        command -v xcodegen || brew install xcodegen
        command -v swiftlint || brew install swiftlint
        command -v pod >/dev/null || gem install --user-install cocoapods --no-document
        command -v xcpretty >/dev/null || gem install --user-install xcpretty --no-document

    - name: Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: Pods
        key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
        restore-keys: pods-${{ runner.os }}-

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: derived-${{ runner.os }}-xcode16.4-${{ hashFiles('Podfile.lock', 'project.yml') }}
        restore-keys: derived-${{ runner.os }}-xcode16.4-

    - name: Generate & Install
      shell: bash
      run: |
        xcodegen generate --spec project.yml --project .
      # Generate first; framework and pods are handled by later steps.
    - name: Fetch WebBridgeKit Framework
      shell: bash
      run: |
        set -euo pipefail
        rm -rf ../WebBridgeKit-Framework
        git clone --depth 1 \
          "https://x-access-token:${WEBK_FRAMEWORK_TOKEN}@github.com/dyyz1993/WebBridgeKit-Framework.git" \
          ../WebBridgeKit-Framework
    - name: Install Pods
      shell: bash
      run: pod install
